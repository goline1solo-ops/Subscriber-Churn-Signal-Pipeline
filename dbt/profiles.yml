# PATTERN: the connection-info-outside-the-project split, same idea as
# .env vs .env.example - the shape of this file is committed, the actual
# secret VALUES are resolved from environment variables at runtime via
# env_var(), never hardcoded here. See GUIDE.md.
#
# Top-level key below MUST match `profile:` in dbt_project.yml exactly.

app_transform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4

    # Example second target for a BigQuery variant - type/fields change
    # completely, since BigQuery has no server/port/password at all.
    # prod:
    #   type: bigquery
    #   method: oauth
    #   project: your-gcp-project-id
    #   dataset: your_dataset
    #   threads: 4
