version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: churn_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - churn_net

  python:
    build: ./python
    container_name: churn_python
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - churn_net

  dbt:
    build: ./dbt
    container_name: churn_dbt
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - churn_net

networks:
  churn_net:

volumes:
  pgdata:
