# PATTERN: postgres + python + dbt, one shared private network.
# See GUIDE.md before touching this file if any of it is unfamiliar -
# especially the "networks" section, which is the #1 recurring gotcha.

services:
  postgres:
    image: postgres:16
    container_name: app_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Waits until Postgres can actually accept connections (not just "started")
    # before python/dbt are allowed to start - see depends_on below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  python:
    build: ./python
    container_name: app_python
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  dbt:
    build: ./dbt
    container_name: app_dbt
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:

volumes:
  pgdata:
